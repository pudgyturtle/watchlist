<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchlist</title>
  <style>
    :root {
      --text: #212121;
      --muted: #546E7A;
      --line: #E0E0E0;
      --link: #1565C0;
      --fail: #C62828;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "DejaVu Sans", Arial, Helvetica, system-ui, sans-serif;
      background: #fff;
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .bar {
      max-width: 1480px;
      margin: 0 auto;
      padding: 10px 18px 8px;
    }
    .title-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }
    .asof {
      color: var(--muted);
      font-size: 13px;
    }
    nav {
      margin-top: 6px;
      padding-bottom: 4px;
    }
    nav a {
      color: var(--link);
      text-decoration: none;
      font-size: 13px;
      margin-right: 16px;
      white-space: nowrap;
    }
    nav a:hover { text-decoration: underline; }
    main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 4px 18px 56px;
    }
    section { scroll-margin-top: 64px; }
    h2 {
      font-size: 15px;
      font-weight: 700;
      margin: 28px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
      color: #111;
    }
    figure {
      margin: 0 0 26px;
    }
    figcaption {
      font-size: 14px;
      font-weight: 650;
      margin: 0 0 6px;
    }
    figcaption .meta {
      font-weight: 400;
      color: var(--muted);
      font-size: 12px;
      margin-left: 8px;
    }
    figure img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #eee;
      background: #fff;
    }
    .fail-msg {
      color: var(--fail);
      font-size: 13px;
      margin: 0;
      padding: 10px 12px;
      border: 1px solid #ffcdd2;
      background: #fff8f8;
    }
  </style>
</head>
